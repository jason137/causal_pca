[tool.poetry]
name = "causal-pca"
version = "0.1.0"
description = "Online causal PCA via EWMA covariance tracking, numba-accelerated."
packages = [
    { include = "causal_pca" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "^2.0"
numba = "^0.65"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"

[tool.pyright]
include = ["causal_pca", "tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
